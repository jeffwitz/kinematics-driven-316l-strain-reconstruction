name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/fem_inhouse
      - name: Build package
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Test
        # MGIS is source-built and unavailable on the generic runner. Its
        # adapter is exercised by the preserved real-MGIS validation suite;
        # CI still covers the dependency-free protocol and conversions.
        #
        # The threshold lives in `.coveragerc-ci`, with the reason for its
        # value. It is not repeated on this command line: a `--cov-fail-under`
        # here silently overrides the file, which is how the two drifted apart
        # before.
        run: pytest --cov=fem_inhouse --cov-branch --cov-config=.coveragerc-ci

  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml
      - name: Install measurement environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e '.[measurement]'
      - name: Test image observation chain without skips
        shell: bash
        run: |
          set +e
          pytest -m measurement -q -rs 2>&1 | tee /tmp/measurement-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            exit "$status"
          fi
          if grep -Eiq '(^|[[:space:]])[0-9]+ skipped' /tmp/measurement-tests.log; then
            echo "Measurement tests were skipped despite the OpenCV environment."
            exit 1
          fi

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install documentation system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            graphviz \
            latexmk \
            lmodern \
            poppler-utils \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-luatex \
            texlive-fonts-recommended
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-docs.txt
      - name: Install documentation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -r requirements-docs.txt
          python -m pip install -e . --no-deps
      - name: Regenerate documentation figures
        run: |
          python scripts/build_documentation_figures.py
          python scripts/measure_spectral_dtt_contract.py
          python scripts/build_spectral_documentation_figures.py
          python scripts/generate_documentation_evidence.py
      - name: Check generated figures are current
        run: git diff --exit-code -- \
          validation/reference_data/spectral_mechanics_evidence_v1/dtt_contract.json \
          docs/_static docs/_generated
      - name: Build strict HTML documentation
        run: sphinx-build -M html docs docs/_build -W --keep-going
      - name: Build and validate publication PDF
        run: |
          TEXMFVAR=/tmp/texmfvar TEXMFCACHE=/tmp/texmfcache \
            sphinx-build -M latexpdf docs docs/_build -W --keep-going
          python scripts/check_documentation_pdf.py
      - name: Upload publication PDF
        if: ${{ success() && hashFiles('docs/_build/latex/kinematics-driven-316l-strain-reconstruction.pdf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: spectral-documentation-pdf
          path: |
            docs/_build/latex/kinematics-driven-316l-strain-reconstruction.pdf
            docs/_build/latex/pdf_validation.json
          if-no-files-found: error
      - name: Upload PDF diagnostics on failure
        if: ${{ failure() && hashFiles('docs/_build/latex/kinematics-driven-316l-strain-reconstruction.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: spectral-documentation-pdf-diagnostics
          path: |
            docs/_build/latex/kinematics-driven-316l-strain-reconstruction.log
            docs/_build/latex/kinematics-driven-316l-strain-reconstruction.tex
            docs/_build/latex/pdf_validation.json
          if-no-files-found: warn
