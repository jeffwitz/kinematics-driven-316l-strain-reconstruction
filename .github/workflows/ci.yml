name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/fem_inhouse
      - name: Build package
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Test
        run: pytest --cov=fem_inhouse --cov-branch --cov-fail-under=85
