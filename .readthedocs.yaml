version: 2

formats:
  - htmlzip
  - pdf

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - fonts-freefont-otf
    - graphviz
    - inkscape
    - latexmk
    - texlive-fonts-recommended
    - texlive-latex-extra
    - texlive-latex-recommended
    - texlive-luatex

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: requirements-docs.txt
    - method: pip
      path: .
