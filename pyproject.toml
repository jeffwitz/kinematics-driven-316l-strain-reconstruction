[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kinematics-driven-316l-strain-reconstruction"
version = "0.1.0"
description = "Kinematics-driven FEM reconstruction of microscale strain localization in 316L."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=2,<3",
    "pypardiso>=0.4.7,<0.5",
    "scipy>=1.14,<2",
]

[project.scripts]
fem-inhouse = "fem_inhouse.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["src/fem_inhouse/__main__.py"]
source = ["fem_inhouse"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"compare_evm_fields.py" = ["E402", "E501", "N803", "N806", "N811"]
"fem_test_driver.py" = ["E402"]
"src/fem_inhouse/core/nonlinear.py" = ["N802", "N803", "N806"]
"visual_fem_test.py" = ["E402", "N803", "N806", "N816"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pypardiso", "scipy.*"]
ignore_missing_imports = true
