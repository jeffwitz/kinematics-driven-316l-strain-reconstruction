[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kinematics-driven-316l-strain-reconstruction"
version = "0.1.0"
description = "Kinematics-driven FEM reconstruction of microscale strain localization in 316L."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.11,<4",
    "matplotlib>=3.8,<4",
    "numpy>=2,<3",
    # Sparse convex QP for the positive-dissipation constraint of the reduced
    # plastic inverse. SciPy has no QP: `trust-constr` did not finish in ten
    # minutes on 320 unknowns, and a hand-rolled add-only active set is wrong
    # once the cuts outnumber the unknowns.
    "osqp>=1.1,<2",
    "pypardiso>=0.4.7,<0.5",
    "PyYAML>=6,<7",
    "scikit-image>=0.24,<0.26",
    "scipy>=1.14,<2",
    "threadpoolctl>=3.5,<4",
]

[project.scripts]
fem-inhouse = "fem_inhouse.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "types-PyYAML>=6,<7",
]
docs = [
    "Sphinx==9.1.0",
    "myst-parser==5.1.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-design==0.7.0",
    "sphinx-rtd-theme==3.1.0",
]
measurement = [
    "opencv-contrib-python-headless==4.14.0.94",
    "Pillow>=10,<13",
]
fftw = [
    "pyfftw>=0.15,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fem_inhouse = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
# `scripts` is a repository package, not an installed one. Without this the
# suite passes under `python -m pytest`, which puts the working directory on the
# path, and fails under the bare `pytest` that CI runs.
pythonpath = ["."]
markers = [
    "mfront: requires a compiled MFront behaviour and MGIS runtime",
    "measurement: requires OpenCV and exercises the image observation chain",
]

[tool.coverage.run]
branch = true
omit = ["src/fem_inhouse/__main__.py"]
source = ["fem_inhouse"]

[tool.coverage.report]
# Kept equal to `.coveragerc-ci`, which carries the rationale. A developer
# machine scores well above this -- it has MFront and OpenCV, and this profile
# does not omit `core/mfront.py` -- so the threshold is the CI one, the lower
# bound of the two. Passing here therefore says little; the CI job is what
# guards the number.
fail_under = 68
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["references/legacy_abaqus", "references/legacy_dic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"compare_evm_fields.py" = ["E402", "E501", "N803", "N806", "N811"]
"docs/conf.py" = ["RUF001"]
"fem_test_driver.py" = ["E402"]
"scripts/build_documentation_figures.py" = ["RUF001"]
"src/fem_inhouse/core/nonlinear.py" = ["N802", "N803", "N806"]
"visual_fem_test.py" = ["E402", "N803", "N806", "N816"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["cv2", "h5py", "mgis.*", "pypardiso", "scipy.*", "tfel.*"]
ignore_missing_imports = true
