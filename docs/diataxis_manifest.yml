  - glob: "how-to/maintenance/*.md"
    mode: how-to
    domain: operations
    status: current
    navigation: how-to/maintenance
  - glob: "how-to/*.md"
    mode: how-to
    domain: legacy
    status: historical
    navigation: legacy
  - path: reference/index.md
    mode: reference
    domain: software
    status: current
