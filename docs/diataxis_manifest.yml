version: 1
description: >-
  Canonical documentation routing.  A declaration may cover a stable family
  of pages with a glob; every public page must match exactly one declaration.

pages:
  - path: index.rst
    mode: portal
    domain: architecture
    status: current
    navigation: home
  - path: evidence/index.md
    mode: portal
    domain: evidence
    status: current
    navigation: evidence
  - path: maintainers/index.md
    mode: portal
    domain: architecture
    status: current
    navigation: maintainers
  - path: tutorials/index.md
    mode: tutorial
    domain: reconstruction
    status: current
    navigation: tutorials
  - glob: "tutorials/*.md"
    mode: tutorial
    domain: reconstruction
    status: current
    navigation: tutorials
  - path: how-to/index.md
    mode: how-to
    domain: software
    status: current
    navigation: how-to
  - glob: "how-to/installation/*.md"
    mode: how-to
    domain: software
    status: current
    navigation: how-to/installation
  - glob: "how-to/data/*.md"
    mode: how-to
    domain: dic
    status: current
    navigation: how-to/data
  - glob: "how-to/mechanics/*.md"
