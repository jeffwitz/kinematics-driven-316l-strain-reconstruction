   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(23.406367 125.812889)">Measured displacement</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(39.390352 136.437889)">at 1.84 µm/pixel</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="213.66" y="104.564029" transform="rotate(-0 213.66 104.564029)">Preparation</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(183.558711 126.069881)">V → uₓ, U → uᵧ</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(171.357891 136.437889)">pixels → millimetres</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="353.16" y="104.564029" transform="rotate(-0 353.16 104.564029)">Local fields</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(323.999023 125.80824)">σᵧ(x,y), K(x,y)</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(309.619414 136.437889)">effective descriptors</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="492.66" y="104.564029" transform="rotate(-0 492.66 104.564029)">CPS4 mesh</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(450.703203 125.812889)">1 pixel = 1 element</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(445.087227 137.261326)">DIC-driven boundaries</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="632.16" y="104.563619" transform="rotate(-0 632.16 104.563619)">MFront + Newton</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(589.746992 125.812889)">Analytical J2/Ludwik</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(593.838945 136.437889)">global equilibrium</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="771.66" y="104.564029" transform="rotate(-0 771.66 104.564029)">Reconstruction</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(748.462969 126.127654)">U, S, E, PE,</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #404040" transform="translate(744.286016 136.773904)">PEEQ and RF</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #17324d" x="425.7" y="41.848875" transform="rotate(-0 425.7 41.848875)">From measured kinematics to a mechanically admissible field</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #404040" x="425.7" y="217.827949" transform="rotate(-0 425.7 217.827949)">DIC provides the observation; the FE solve enforces equilibrium. Local parameters reproduce spatial organization and are not intrinsic grain properties.</text>
   </g>
